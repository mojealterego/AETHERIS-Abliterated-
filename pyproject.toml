[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetheris-abliteration-lab"
version = "0.3.2"
description = "Auditable Qwen3 refusal-direction research and local model build for AETHERIS OmniFlow Ω"
requires-python = ">=3.12,<3.15"
dependencies = [
    "torch>=2.5,<3",
    "transformers>=5.0,<6",
    "accelerate>=1.4,<3",
    "huggingface-hub>=0.35,<3",
    "safetensors>=0.5,<1",
    "psutil>=7,<8",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
aetheris-abliterate = "aetheris_abliteration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
